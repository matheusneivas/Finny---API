# ─────────────────────────────────────────────────────────────────────────────
# Configuração base = PRODUÇÃO. Segredos vêm SEMPRE de variáveis de ambiente.
# Para desenvolvimento local use SPRING_PROFILES_ACTIVE=dev (ver application-dev.yml).
# Lista completa de variáveis: .env.example
# ─────────────────────────────────────────────────────────────────────────────
spring:
  application:
    name: finny-api

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:finny_db}${DB_URL_PARAMS:}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 30000
      # Schema das tabelas da API (no Supabase usamos "fini", fora do schema public exposto pela Data API)
      schema: ${DB_SCHEMA:public}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: ${DB_SCHEMA:public}

  flyway:
    enabled: true
    default-schema: ${DB_SCHEMA:public}
    schemas: ${DB_SCHEMA:public}
    create-schemas: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 6MB

  data:
    web:
      pageable:
        max-page-size: 100

  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}
  # Atrás de proxy/load balancer (Render, Railway, Nginx...) use FORWARD_HEADERS_STRATEGY=framework
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
  tomcat:
    max-swallow-size: 6MB
    # Uma linha por requisição no log (método, caminho sem query string, status, duração).
    # Sem IP, headers ou corpo. O health check do Render fica de fora.
    accesslog:
      enabled: ${ACCESS_LOG_ENABLED:true}
      directory: /dev
      prefix: stdout
      suffix: ""
      file-date-format: ""
      rotate: false
      buffered: false
      pattern: "%{yyyy-MM-dd'T'HH:mm:ss.SSSXXX}t ACCESS %m %U %s %{ms}Tms"
      condition-unless: noAccessLog
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
  compression:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}

jwt:
  # Obrigatório, mínimo 32 bytes. Gere com: openssl rand -base64 48
  secret: ${JWT_SECRET:}
  expiration: ${JWT_EXPIRATION:1800000}               # access token: 30 minutos
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:2592000000}  # refresh token: 30 dias

ai:
  provider: ${AI_PROVIDER:anthropic}        # anthropic | openai
  model: ${AI_MODEL:claude-haiku-5-5}
  api-key: ${AI_API_KEY:}
  base-url: ${AI_BASE_URL:}
  max-tokens: ${AI_MAX_TOKENS:4096}
  effort: ${AI_EFFORT:low}
  max-tool-iterations: ${AI_MAX_TOOL_ITERATIONS:5}
  timeout: ${AI_TIMEOUT:60s}
  max-retries: ${AI_MAX_RETRIES:2}

internal:
  # Chave para callbacks do n8n (header X-Internal-API-Key). Mínimo 32 caracteres.
  api-key: ${INTERNAL_API_KEY:}

firebase:
  service-account-path: ${FIREBASE_SERVICE_ACCOUNT_PATH:}

storage:
  type: ${STORAGE_TYPE:local}
  local:
    base-path: ${STORAGE_LOCAL_PATH:/tmp/finny-images}

app:
  cors:
    # Só para a versão web (o app mobile não usa CORS). Ex.: https://app.finny.com.br
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  cpf-secret: ${CPF_SECRET:}
  auth:
    # Exige confirmar o e-mail com código antes de usar as rotas de dados (só vale com MAIL_PROVIDER ligado)
    require-email-verification: ${REQUIRE_EMAIL_VERIFICATION:true}
  mail:
    # resend | brevo | none (none = não envia e a verificação fica desligada)
    provider: ${MAIL_PROVIDER:none}
    from: ${MAIL_FROM:Finny <onboarding@resend.dev>}
    api-key: ${RESEND_API_KEY:${BREVO_API_KEY:}}
  chat:
    free-monthly-limit: ${CHAT_FREE_MONTHLY_LIMIT:5}
    premium-monthly-limit: ${CHAT_PREMIUM_MONTHLY_LIMIT:1000}
    timezone: ${APP_TIMEZONE:America/Sao_Paulo}
    history-size: ${CHAT_HISTORY_SIZE:12}
  plan:
    # Limites do plano grátis (o do chat é CHAT_FREE_MONTHLY_LIMIT)
    free-transactions-per-month: ${FREE_TRANSACTIONS_PER_MONTH:15}
    free-active-goals: ${FREE_ACTIVE_GOALS:1}
  billing:
    # mercadopago | none (none = ninguém consegue assinar; o resto da API funciona normal)
    provider: ${BILLING_PROVIDER:none}
    monthly-price: ${PREMIUM_MONTHLY_PRICE:9.90}
    pix-days: ${PREMIUM_PIX_DAYS:30}
    trial-days: ${PREMIUM_TRIAL_DAYS:7}
    grace-days: ${PREMIUM_GRACE_DAYS:3}
    # Página do site para onde o Mercado Pago volta depois do checkout do cartão
    return-url: ${BILLING_RETURN_URL:}
    mercado-pago:
      access-token: ${MERCADOPAGO_ACCESS_TOKEN:}
      webhook-secret: ${MERCADOPAGO_WEBHOOK_SECRET:}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    auth-per-minute: ${RATE_LIMIT_AUTH:10}
    refresh-per-minute: ${RATE_LIMIT_REFRESH:30}
    chat-per-minute: ${RATE_LIMIT_CHAT:15}
    upload-per-minute: ${RATE_LIMIT_UPLOAD:10}
    avatar-per-hour: ${RATE_LIMIT_AVATAR:10}
    default-per-minute: ${RATE_LIMIT_DEFAULT:300}

logging:
  level:
    root: INFO
    com.finny.api: INFO
