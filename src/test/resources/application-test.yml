spring:
  datasource:
    url: jdbc:h2:mem:finnytest;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

jwt:
  secret: test-secret-0123456789-0123456789-0123456789

internal:
  api-key: test-internal-key-0123456789abcdef0123

app:
  mail:
    provider: log
    async: false
  auth:
    # Ligado só nos testes de verificação de e-mail
    require-email-verification: false
  cpf-secret: test-cpf-secret-0123456789
  rate-limit:
    enabled: false

ai:
  api-key: test-key
