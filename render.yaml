# Blueprint do Render: só a API (Docker). O banco PostgreSQL fica no Supabase.
# No painel do Render: New > Blueprint > escolha este repositório. Guia: docs/DEPLOY_RENDER.md
#
# Plano "free" para começar: a API "dorme" após 15 min sem uso (a primeira requisição
# depois disso demora ~1 min). Para uso real, troque no painel para Starter.
#
# O banco antigo do Render (fini-db) saiu deste arquivo, mas o Render NÃO apaga recursos
# removidos do Blueprint: ele continua existindo até ser apagado à mão no painel.

services:
  - type: web
    name: fini-api
    runtime: docker
    plan: free
    region: virginia
    branch: master
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      # Banco no Supabase (Session pooler, IPv4, aceita prepared statements e Flyway).
      # Host, usuário e senha são preenchidos à mão em Environment (guia: docs/DEPLOY_RENDER.md).
      - key: DB_HOST
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        value: postgres
      # Tabelas no schema "fini", fora do "public" que a Data API do Supabase expõe
      - key: DB_SCHEMA
        value: fini
      - key: DB_URL_PARAMS
        value: "?sslmode=require"
      # Plano grátis do Supabase tem poucas conexões no pooler: 5 é suficiente para a API
      - key: DB_POOL_SIZE
        value: "5"

      # Segredos gerados pelo próprio Render (valores aleatórios fortes, ninguém precisa digitar)
      - key: JWT_SECRET
        generateValue: true
      - key: INTERNAL_API_KEY
        generateValue: true
      - key: CPF_SECRET
        generateValue: true

      # Chave da Anthropic: o Render pede o valor na criação do Blueprint
      - key: AI_API_KEY
        sync: false
      - key: AI_PROVIDER
        value: anthropic
      - key: AI_MODEL
        value: claude-haiku-5-5
      - key: AI_EFFORT
        value: low

      # Pagamentos (Premium R$ 9,90). Guia: docs/PAGAMENTOS.md
      # Deixe BILLING_PROVIDER=none até ter o token do Mercado Pago.
      - key: BILLING_PROVIDER
        value: none
      - key: MERCADOPAGO_ACCESS_TOKEN
        sync: false
      - key: MERCADOPAGO_WEBHOOK_SECRET
        sync: false
      - key: BILLING_RETURN_URL
        sync: false

      # Render fica atrás de um proxy: usar o IP real do cliente no rate limit
      - key: FORWARD_HEADERS_STRATEGY
        value: framework
      - key: API_DOCS_ENABLED
        value: "false"
      # Endereço do site (versão web), ex.: https://finny-ia.vercel.app (sem barra no final; vários separados
      # por vírgula). Preenchido à mão em Environment para o Blueprint não apagar o valor a cada sincronização.
      - key: CORS_ALLOWED_ORIGINS
        sync: false

      # JVM ajustada para 512 MB (plano free)
      - key: JAVA_OPTS
        value: "-XX:MaxRAMPercentage=70 -XX:+UseSerialGC -Xss512k -XX:TieredStopAtLevel=1 -Duser.timezone=America/Sao_Paulo"
